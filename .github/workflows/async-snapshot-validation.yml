name: Async snapshot validation
on:
  push:
    branches: [codex/validate-async-snapshot-20261031]
permissions:
  contents: read
jobs:
  checkpoint-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            torch: '2.6.0'
          - python: '3.12'
            torch: '2.9.1'
    env:
      PYTHONPATH: src:tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install 'torch==${{ matrix.torch }}' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/pytorch/base.txt 'numpy<2.4.5' 'pytest==9.0.2' pytest-mock pytest-timeout pytest-rerunfailures pytest-random-order psutil 'ruff==0.15.9'
          mkdir evidence
          python -m pip freeze > evidence/dependencies.txt
          git rev-parse HEAD > evidence/validation-head.txt
          sha256sum src/lightning/pytorch/plugins/io/async_plugin.py tests/tests_pytorch/plugins/test_async_checkpoint.py > evidence/source-sha256.txt
      - name: Verify regressions fail on upstream
        run: |
          cp src/lightning/pytorch/plugins/io/async_plugin.py /tmp/fixed_async_plugin.py
          git show 84df182f50ab34301aabb3c0eb4031815bfb413d:src/lightning/pytorch/plugins/io/async_plugin.py > src/lightning/pytorch/plugins/io/async_plugin.py
          set +e
          python -m pytest tests/tests_pytorch/plugins/test_async_checkpoint.py -k snapshots_mutable -q --timeout=60 --junitxml=evidence/before.xml > evidence/before.log 2>&1
          status=$?
          set -e
          cp /tmp/fixed_async_plugin.py src/lightning/pytorch/plugins/io/async_plugin.py
          cat evidence/before.log
          test "$status" = 1
          python -c "import xml.etree.ElementTree as E; s=E.parse('evidence/before.xml').find('testsuite'); assert s.get('tests')=='2' and s.get('failures')=='2' and s.get('errors')=='0', s.attrib"
      - name: Run native checkpoint tests
        run: |
          python -m pytest tests/tests_pytorch/plugins/test_async_checkpoint.py tests/tests_pytorch/plugins/test_checkpoint_io_plugin.py tests/tests_fabric/utilities/test_cloud_io.py -q --timeout=120 --junitxml=evidence/after.xml | tee evidence/after.log
      - name: Check changed-file style
        run: |
          ruff check src/lightning/pytorch/plugins/io/async_plugin.py tests/tests_pytorch/plugins/test_async_checkpoint.py
          ruff format --check src/lightning/pytorch/plugins/io/async_plugin.py tests/tests_pytorch/plugins/test_async_checkpoint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-evidence-${{ matrix.python }}
          path: evidence/
